# Task 12 preliminary design P4: the open sources of the fuselage moment method and of the propeller normal force.
# Written by hand on 2026-11-27 from files opened in that session on ntrs.nasa.gov (the owner allowed the host).
# No value here is from memory. The PDFs stay in the session scratchpad and are not committed.
# Read by prelim/p4_methods.py; tests/task12_pd/test_p4_methods.py checks this file.

why: >-
  Spec P4 step 2 asks for a fuselage-inclusive neutral point by a route other than Raymer's single factor (16.22):
  the fuselage moment slope integrated strip by strip over the loft's width with the wing's upwash and downwash
  (Multhopp), and the pusher propeller's normal force (Raymer (16.26) with Figs. 16.15 and 16.16). The library's
  notes do not hold those two figures at this aircraft's advance ratios and the book could not be opened in this
  session (its file is above the download limit of the Drive connector), so the propeller term uses the open NACA
  report that states the same method (thrust factor f times the zero-thrust normal-force derivative).

