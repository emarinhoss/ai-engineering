  - id: OC-15
    flagged_2026_11_25: null
    correlation: "Raymer Table 6.4 tail volume coefficient, general aviation single engine"
    calibrated_for: "tractor aircraft that rotate about a main gear close behind the centre of gravity"
    used_here: "the pusher's horizontal tail is enlarged above the table's size until it can rotate the aircraft"
    status: applies
    carried_by: "tail_cl_max_rotation and rotation_angle_deg_pusher bands; P4 (rotation at the CG ends, item 25)"
    evidence:
