# Preliminary design P1: the judgements of the Stage 1 package for r0
# (docs/specs/task12_preliminary_design.md, package P1). Written by the package lead, not by a run.
# Nothing here is a result. Numbers of the aircraft are not typed here: where a line needs one, it names
# the record field (`evidence`) and prelim/p1_report.py reads it. A band written under `proposed_band`
# is a proposal for Gate C. It is NOT applied to the ledger and no run of P1 sizes with it.
#
# files named in `evidence`: r0 = r0/design_pusher.json, info_gap = r0/info_gap.json,
# cell = r0/cell_result.json, p0 = p0/p0.json, perf = the Gate B perf.json, p1 = this package's p1.json.

# ---- band audit: the 58 ledger entries without a band (Gate B item 28) -------------------------------
# class: requirement  = what the owner asked for or ruled (an R-row, a margin, a ruled value);
#        definition   = a design choice of this aircraft, a design rule or limit used as a rule, a datum of
#                       the chosen engine, a definition, or a model switch: not an uncertain quantity;
#        needs a band = an estimate of a physical quantity the built aircraft will have whatever is assumed.
# For "needs a band": proposed_band is taken from the entry's own source text in the ledger, or it is null
# and `why_no_proposal` says why. measured_by names the package of the spec that measures the quantity, or
# is empty when none does.
band_audit:
  payload_lb:            {class: requirement, reason: "R4"}
  radius_nm:             {class: requirement, reason: "R5"}
  loiter_h:              {class: requirement, reason: "R5. The value is the sized loiter of the robust sizing (ruling R-d), an output of that sizing, not an uncertain input"}
  r5_robust_hours:       {class: requirement, reason: "R5 as restated at Gate B"}
  headwind_kt:           {class: requirement, reason: "R19. The info-gap study leaves it outside the horizon by owner decision (r0/info_gap.json, exclusions)"}
  mission_altitude_ft:   {class: requirement, reason: "R6"}
  field_length_ft:       {class: requirement, reason: "R7"}
  stall_speed_kt:        {class: requirement, reason: "R7"}
  limit_load_factor:     {class: requirement, reason: "R9"}
  negative_load_factor:  {class: requirement, reason: "R9, ruling B-3"}
  margin_power_fraction: {class: requirement, reason: "Gate A round 4 ruling 4, relaxed at the round 4 close"}
  margin_ceiling_ft:     {class: requirement, reason: "Gate A round 4 ruling 4"}
  margin_gust_g:         {class: requirement, reason: "Gate A round 4 ruling 4"}
  climb_rate_sl_fpm:     {class: requirement, reason: "R12"}
  ceiling_ft:            {class: requirement, reason: "R12"}
  ceiling_rate_fpm:      {class: definition,  reason: "the definition of the service ceiling in R12"}
  static_margin_min:     {class: requirement, reason: "R13"}
  static_margin_max:     {class: requirement, reason: "R13"}
  speed_over_stall:      {class: requirement, reason: "R17"}
  propeller_model:       {class: definition,  reason: "model switch (ruling G-4)"}
  takeoff_minutes:       {class: definition,  reason: "mission-profile allowance (warm-up and take-off at full power); part of the mission the fuel is sized for, like the segments of R5"}
  propeller_rpm:         {class: definition,  reason: "datum of the chosen engine's gearbox (ruling R-b)"}
  tip_speed_limit_fps:   {class: definition,  reason: "design rule that sets the propeller diameter"}
  installed_engine_factor:
    class: needs a band
    reason: "the installed weight of this engine in this airframe is not known; the factor is a general-aviation average"
    proposed_band: null
    why_no_proposal: "the ledger's source gives one value. The +-5 % empty-weight band (ruling B-2a) covers it in aggregate; a band of its own would count the same uncertainty twice unless that band is narrowed"
    measured_by: []
    carried_under: "B-9g (empty weight is a named risk)"
  fuel_density_lb_gal:
    class: needs a band
    reason: "a fuel property that varies with temperature and batch; it sets the tank volume needed, not the fuel weight"
    proposed_band: null
    why_no_proposal: "no range in the ledger's source; the tank-volume margin is what matters and P3 checks it on the loft"
    measured_by: [P3]
  airfoil_efficiency:
    class: needs a band
    reason: "section lift-curve slope over 2 pi; it sets the wing lift slope and with it the gust load factor"
    proposed_band: null
    why_no_proposal: "P2 reads the lift-curve slope of the chosen section from measured data; the band should come from that reading"
    measured_by: [P2]
  wing_x_c_max_t:        {class: definition,  reason: "geometry of the wing section, fixed when P2 fixes the section (PD-5)"}
  wing_taper:            {class: definition,  reason: "design choice, frozen (PD-3)"}
  flap_delta_cl_max:
    class: needs a band
    reason: "the flap's lift increment sets the take-off and landing C_L,max; one table value"
    proposed_band: null
    why_no_proposal: "the ledger's source gives one value. P2 uses the same table for the flapped increment, so no package measures it"
    measured_by: []
    carried_under: "item 1 covers the clean value only; the flapped increment stays an assumption"
  roughness_k_ft:
    class: needs a band
    reason: "surface finish in service; enters every skin-friction coefficient"
    proposed_band: null
    why_no_proposal: "no range in the ledger's source"
    measured_by: []
    carried_under: "G-3, B-5 (item 14: CD0 has no second route)"
  leakage_fraction:
    class: needs a band
    reason: "it multiplies the whole parasite drag; the drag build-up has no band of its own, and Gate B found that its method resolves CD0 to about +-20 % (G-3)"
    proposed_band: null
    why_no_proposal: "the width is the owner's choice: this entry is the natural carrier of a CD0 band, because the info-gap study has none. The package records what +10 % on CD0 costs (leakage_fraction 0.155)"
    measured_by: []
    carried_under: "G-3, B-5 (item 14)"
    extra_values: [0.155]
  tail_interference_q:
    class: needs a band
    reason: "interference factor on tail drag"
    proposed_band: [1.04, 1.05]
    basis: "the range printed in the entry's own source text"
    measured_by: []
  tail_eta_h:
    class: needs a band
    reason: "dynamic-pressure ratio at the tail; it scales the tail's contribution to the neutral point and to trim, behind a pusher propeller"
    proposed_band: null
    why_no_proposal: "the ledger's source gives 'about 0.9' and no range; the slipstream at the tail is out of scope (NR-16)"
    measured_by: []
    carried_under: "NR-16 (out of scope); P4 uses the value"
  engine_sfc_allowance:  {class: requirement, reason: "ruling R-b. The uncertainty of the SFC is the banded engine_sfc_mult of the info-gap study, on top of this allowance"}
  ht_aspect_ratio:       {class: definition,  reason: "design choice, frozen (PD-3)"}
  ht_taper:              {class: definition,  reason: "design choice, frozen (PD-3)"}
  vt_aspect_ratio:       {class: definition,  reason: "design choice, frozen (PD-3)"}
  vt_taper:              {class: definition,  reason: "design choice, frozen (PD-3)"}
  tail_t_c:              {class: definition,  reason: "design choice: NACA 0012 tails (PD-5)"}
  c_ht:                  {class: definition,  reason: "sizing rule for the first tail size; the tail is then enlarged for rotation and P4 checks the result"}
  c_vt:                  {class: definition,  reason: "sizing rule for the vertical tail. No requirement checks its result (PD-11: no lateral-directional analysis)"}
  composite_model:       {class: definition,  reason: "model switch (ruling B-2a)"}
  gear_load_factor_ultimate: {class: definition, reason: "design rule in the gear weight equation"}
  wing_tank_usable:
    class: needs a band
    reason: "usable share of the tank box volume"
    proposed_band: null
    why_no_proposal: "the ledger's source gives one value; P3 measures the tank volume on the loft"
    measured_by: [P3]
  cl_ground:
    class: needs a band
    reason: "lift coefficient in the ground attitude; it enters the ground roll and the rotation moment. The source's value is for an aircraft without large flaps, and the take-off is flown with the flap at 30 deg"
    proposed_band: [0.0, 0.1]
    basis: "the entry's own source text ('usually below 0.1'); the upper end is not covered by it for a deflected flap, which is why a band is needed"
    measured_by: []
  climb_speed_over_stall: {class: definition, reason: "speed rule: the lowest climb speed"}
  tyre_drag_per_area:
    class: needs a band
    reason: "gear drag with the gear down (take-off and landing)"
    proposed_band: [0.13, 0.25]
    basis: "the two values in the entry's own source text (faired and regular wheel)"
    measured_by: []
  strut_drag_per_area:
    class: needs a band
    reason: "gear drag with the gear down"
    proposed_band: null
    why_no_proposal: "the ledger's source gives one value"
    measured_by: []
  gear_interference:
    class: needs a band
    reason: "gear drag with the gear down"
    proposed_band: [1.2, 1.284]
    basis: "the entry's own source text: 1.2 for mutual interference, 1.284 with the 7 % for open wells"
    measured_by: []
  tipback_angle_deg:     {class: definition,  reason: "layout rule"}
  prop_clearance_in:     {class: definition,  reason: "layout rule"}
  nose_load_min:         {class: definition,  reason: "layout rule (the optimum band)"}
  nose_load_max:         {class: definition,  reason: "layout rule (the optimum band)"}
  turn_bank_deg:         {class: requirement, reason: "R16"}
  overturn_max_deg:      {class: definition,  reason: "layout rule"}
  flap_cp_fraction:
    class: needs a band
    reason: "centre of pressure of the flap's lift; it enters the rotation moment, whose margin is thin (item 25)"
    proposed_band: [0.44, 0.45]
    basis: "the range printed in the entry's own source text"
    measured_by: [P4]
  vc_placard_kt_eas:     {class: requirement, reason: "R18, ruling B-4"}
  main_wheel_load_fraction: {class: definition, reason: "rule for sizing the tyres; P4 computes the wheel loads of the layout"}

# ---- out-of-calibration list ---------------------------------------------------------------------------
# flagged_2026_11_25: the tag of the bullet in docs/validation/2026-11-25_task12_conceptual_m250_appl.md
# (section 9, "Used outside its calibration") that this entry continues; null for an entry that is new here.
# status: applies | applies to the concept record only | dropped (with reason).
# carried_by: the band, ruling or package that carries or measures it.
out_of_calibration:
  - id: OC-1
    flagged_2026_11_25: "Table 3.1 and Table 6.2"
    correlation: "Raymer Table 3.1 and Table 6.2 empty-weight fits and the general-aviation group weights (15.46)-(15.57)"
    calibrated_for: "crewed general-aviation aircraft"
    used_here: "a crewless composite aircraft, with the crew items left out"
    status: applies
    carried_by: "empty_weight_factor band 0.95 to 1.05 (B-2a); named risk (B-9g); P7 sizes the wing spar from the bottom up"
  - id: OC-2
    flagged_2026_11_25: "Table 6.3"
    correlation: "Raymer Table 6.3 fuselage length"
    calibrated_for: "crewed aircraft"
    used_here: "it sets the fuselage length, the tail arm and the fuselage wetted area"
    status: applies
    carried_by: "fuselage_fineness and fuselage_fill bands; P3 replaces the body with a loft and checks the areas"
  - id: OC-3
    flagged_2026_11_25: "Table 3.4"
    correlation: "Raymer Table 3.4 turboprop consumption"
    calibrated_for: "large turboprops"
    used_here: "the rubber-engine design of the concept record only. r0 reads its App. K engine table (see OC-9)"
    status: applies to the concept record only
    carried_by: "the rubber-engine design is a reference, not a design of record"
  - id: OC-4
    flagged_2026_11_25: "Table 10.4"
    correlation: "Raymer Table 10.4 turboprop weight and size"
    calibrated_for: "400 to 5,000 bhp"
    used_here: "the rubber engine of the concept record lies below the range (its record says so). For r0 the engine weight is the type certificate's and only the envelope dimensions come from the table, at a power inside its range (the record's flag)"
    status: applies to the concept record only
    carried_by: "P3 places the engine envelope of the record's source in the loft"
    evidence:
      - {label: "r0 engine inside the table's range", file: r0, path: engine.in_range}
      - {label: "rubber engine inside the table's range", file: p1, path: concepts.designs.pusher_rubber.engine_in_range}
  - id: OC-5
    flagged_2026_11_25: "(13.9)"
    correlation: "Raymer (13.9) power lapse with altitude"
    calibrated_for: "piston engines"
    used_here: "the rubber-engine design of the concept record only; r0 reads the App. K table"
    status: applies to the concept record only
    carried_by: "the rubber-engine design is a reference; its ceiling row is not a verdict on the concept"
  - id: OC-6
    flagged_2026_11_25: "(12.49)"
    correlation: "Raymer (12.49) span efficiency"
    calibrated_for: "a fit for straight wings"
    used_here: "it sets the induced drag of a wing of aspect ratio 8"
    status: applies
    carried_by: "no band: the info-gap study leaves e outside the horizon by owner decision; item 21 (not comparable as specified)"
