    correlation: "downwash at the tail from the vortex lattice (planar wake, wing alone, no fuselage or slipstream)"
    calibrated_for: "an isolated wing"
    used_here: "the tail behind a fuselage and ahead of a pusher propeller"
    status: applies
    carried_by: "tail_height_over_df band; P4 (fuselage-inclusive neutral point); slipstream out of scope (NR-16)"
  - id: OC-8
    flagged_2026_11_25: "Gear and tyre drag"
    correlation: "gear and tyre drag per frontal area"
    calibrated_for: "readings of Raymer's gear-drag table as used in DR-1"
    used_here: "take-off and landing drag with the gear down"
    status: applies
    carried_by: "no band today; the band audit proposes bands for tyre_drag_per_area and gear_interference"
  - id: OC-9
