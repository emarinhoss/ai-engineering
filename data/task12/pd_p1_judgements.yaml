# ---- risk list (Gate A item A11: every risk names the package that measures it) --------------------------
# measured_by: packages of docs/specs/task12_preliminary_design.md. A risk that no package measures has an
# empty list and says under which ruling it is carried.
risks:
  - id: K-1
    risk: "Empty weight comes from crewed general-aviation statistics"
    effect: "take-off weight through the growth of the sizing; hours on station of the built aircraft"
    items: [8, 27]
    measured_by: [P7, P4, P9]
    how: "P7 sizes the wing spar from the bottom up against the statistical wing weight; P4 moves the centre of gravity at the ends of the empty-weight band; P9 keeps the +-5 % band acting"
    carried_under: "B-9g"
    evidence:
      - {label: "build-up empty fraction", file: r0, path: empty_fraction_comparison.build_up}
      - {label: "approximate group weights (Raymer p. 398)", file: r0, path: empty_fraction_comparison.table_15_2_approximate}
      - {label: "Anderson build-up W0 against Stage 1 (relative)", file: perf, path: "rows[id=w0_buildup].deviation"}
  - id: K-2
    risk: "Clean C_L,max rests on a judged section value"
    effect: "the R17 speed floor sets the loiter and cruise speeds; the stall clause of R7"
    items: [1]
    measured_by: [P2]
    how: "measured section data at the design Reynolds number, then the wing value"
    evidence:
      - {label: "clean C_L,max", file: r0, path: CL_max.clean}
      - {label: "clean stall at W0 (kt)", file: r0, path: performance.V_stall_clean_kt}
  - id: K-3
    risk: "Propeller: an actuator disk times a judged factor f, with no independent check in flight, in climb or at take-off"
    effect: "R7 take-off is the binding robustness horizon; the climb fuel at the worst corner"
    items: [3, 13, 15, 16, 17]
    measured_by: [P6]
    how: "blade-element propeller at the record's operating points and at the take-off speeds"
    evidence:
      - {label: "R7 horizon", file: info_gap, path: h_hat.R7.h_hat}
      - {label: "efficiency at sea-level climb", file: r0, path: propeller_points.climb_sea_level.eta_p}
  - id: K-4
    risk: "Engine fuel consumption at part power and altitude rests on a cycle model with no maker's data"
    effect: "mission fuel and hours on station move directly with SFC"
    items: [10, 11]
    measured_by: []
    how: "no package: no maker's part-power curve exists in the sources (O-3). The +-10 % SFC band stands in for data"
    carried_under: "G-6, B-5"
    evidence:
      - {label: "share of mission fuel in unchoked cells", file: r0, path: unchoked_fuel_share}
  - id: K-5
    risk: "Engine operating altitude and in-flight relight are assumptions"
    effect: "R6 and R12 are flown above every certified installation found"
    items: [9]
    measured_by: [P8]
    how: "P8 states it as a declared limit (row EP-8); it is not verified by any package"
    carried_under: "R-f"
  - id: K-6
    risk: "Static margin is met by layout construction; the neutral point has only Raymer's single-factor fuselage term"
    effect: "R13; the aft limit of the centre of gravity"
    items: [4]
    measured_by: [P4]
    how: "fuselage-inclusive neutral point by a route independent of (16.22), with the pusher propeller term"
    evidence:
      - {label: "static margin, full fuel (MAC)", file: r0, path: layout.sm_full}
      - {label: "static margin, empty fuel (MAC)", file: r0, path: layout.sm_empty}
  - id: K-7
    risk: "Rotation margin is thin, with a tail half the wing area"
    effect: "a larger tail or a moved main gear; R7 take-off"
    items: [25]
    measured_by: [P4]
    how: "trim and rotation re-checked at the CG ends with the measured section moment"
    evidence:
      - {label: "tail lift coefficient needed at rotation", file: r0, path: layout.rotation.CL_tail_needed}
      - {label: "horizontal-tail area (ft^2)", file: r0, path: horizontal_tail.area}
  - id: K-8
    risk: "Gust loads come from one source; no negative manoeuvre is computed; the worst gust point is past ultimate if the gust is held at 30 ft/s above V_C"
    effect: "limit load factor and structure weight (R9)"
    items: [2, 26]
    measured_by: [P5, P7]
    how: "second gust source and a time integration of the gust response (P5); the ultimate cases on the spar (P7)"
    evidence:
      - {label: "largest gust load factor", file: r0, path: n_gust}
      - {label: "negative gust load factor", file: r0, path: n_negative_gust}
  - id: K-9
    risk: "The V_C placard is held only by the autopilot"
    effect: "structural over-speed: level top speed at sea level is above V_D"
    items: [7]
    measured_by: [P8]
    how: "envelope-protection requirement with numbers (EP-1 to EP-7)"
    evidence:
      - {label: "level top speed, sea level (kt EAS)", file: r0, path: performance.vmax_sl_kt_eas}
      - {label: "V_C (kt EAS)", file: r0, path: V_c_eas_kt.sea_level}
  - id: K-10
    risk: "Parasite drag has no second route and no band of its own; the wetted areas come from factors"
    effect: "hours on station (the band audit records what +10 % on CD0 costs)"
    items: [14]
    measured_by: [P3]
    how: "P3 checks the wetted areas on the loft. A second route for CD0 is out of scope"
    carried_under: "G-3, B-5"
    evidence:
      - {label: "CD0 at mission altitude", file: r0, path: CD0.mission_altitude}
  - id: K-11
    risk: "Stage 1's two-point climb is not valid at the worst endurance corner"
    effect: "climb fuel at the corner, and with it the hours on station that the R5 guarantee rests on"
    items: [18, 23]
    measured_by: [P1, P9]
    how: "measured first here (section 7); P9 decides whether the integrated climb goes into r1 and its robustness study"
    evidence:
      - {label: "integrated minus two-point climb fuel at the corner of h_T (lb)", file: p1, path: climb_check.states.corner_target.fuel_difference_lb}
  - id: K-12
    risk: "Payload-bay volume has never been checked, and the bay sits in the tapering nose with the nose gear and the turret"
    effect: "a longer nose or a moved bay, and with it the centre of gravity"
    items: [30]
    measured_by: [P3, P4]
    how: "first check here (section 12); P3 boxes on the loft (gate 4); P4 if the bay moves"
  - id: K-13
    risk: "Nose-wheel load is above the 8 to 15 % optimum"
    effect: "steering and nose-gear loads; the main gear position"
    items: [31]
    measured_by: [P4]
    how: "nose-wheel load at every loading of the CG envelope"
    evidence:
      - {label: "nose-wheel load, full fuel", file: r0, path: layout.nose_load.full}
      - {label: "nose-wheel load, empty fuel", file: r0, path: layout.nose_load.empty}
  - id: K-14
    risk: "Sponson size, drag and weight are banded assumptions; the main gear is long"
    effect: "drag, empty weight and whether the gear stows"
    items: []
    measured_by: [P3]
    how: "sponsons and the retracted gear drawn on the loft; wetted-area gate 3"
    evidence:
      - {label: "sponson weight (lb)", file: r0, path: components_lb.sponsons}
      - {label: "main gear length (in)", file: r0, path: gear_length_in}
  - id: K-15
    risk: "Wing tank volume is a box estimate"
    effect: "whether the fuel fits"
    items: []
    measured_by: [P3]
