# Task 12 preliminary design P6: measured lift and drag of six propeller sections, NACA Report 259
# (Jacobs, 1928; NTRS 19930091327; source record data/task12/pd_p6_propeller_source.yaml, reports.tr259).
# Tables IV, VI, VIII, X, XII and XIV of the report: the tests at about 20 atmospheres.
# Typed by hand on 2026-11-27 from the page images (200 dpi). Each row is as printed: angle of attack (deg),
# lift coefficient, drag coefficient, and the report's own L/D column. The L/D column is the second reading:
# tests/task12_pd/test_p6_bem.py recomputes C_L/C_D of every row and compares it with the printed ratio.
# The values are for the tested wing, a rectangular wing of aspect ratio 6 (5 in by 30 in), not for a section
# of infinite span; prelim/bem.py removes the induced angle and the induced drag.

