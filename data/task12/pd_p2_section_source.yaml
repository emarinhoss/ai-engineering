    Text files of the plotted points of NACA TR 824, one file per page of the report, made in 1994 by
    Gregory P. D. Siemens at the University of Saskatchewan and declared public domain in the archive's
    Readme.txt. Each file holds angle of attack against lift coefficient, angle of attack against moment
    coefficient about the quarter chord, lift coefficient against drag coefficient, and lift coefficient
    against moment coefficient about the aerodynamic centre.
  repository: "https://github.com/enritoomey/Perfiles2D"
  repository_licence: "MIT (file License of the repository)"
  commit: "64511f3a404398b6637fae047e2747b99ab0bf53"
  folder: "TR824-Digitized"
  fetched: "2026-11-27, git clone --depth 1 through the session proxy"
  files:
    "142.ALL":
      url: "https://github.com/enritoomey/Perfiles2D/blob/64511f3a404398b6637fae047e2747b99ab0bf53/TR824-Digitized/142.ALL"
