# Task 12 preliminary design P9: the findings list for the closing re-record r1.
# Written on 2026-11-28 before any P9 code or run, under owner ruling PD-25 (P9 on Opus 5.5; not yet Fable-reviewed)
# and decisions PD-26 (how the findings enter r1) and PD-27 (the sponson that holds the main gear).
# Every finding of P0 to P8 that bears on an input of the design is listed with the record and the key it is read
# from (a dotted path; a number indexes a list), the value at that key, and whether it is applied to r1, how, and why.
# tests/task12_pd/test_p9_findings.py reads every value again from its record. "applied: true" means the finding
# changes an input of r1; "applied: false" means it does not, with the reason. "entry" names the ledger entry of
# data/task12/ledger_r1.yaml that carries an applied finding (PD-26 item 1); a value marked "measured by P9" is
# measured again on the r1 layout by prelim/p9_r1.py and is in the P9 record, not here.

findings:
  - id: P0-1
    package: P0
    what: integrated climb at nominal values against Stage 1's two-point climb, as a share of the mission fuel
    record: runs/task12/pd/2026-11-27/p0/p0.json
    key: acceptance.4.value
    value: 0.0010777087784519372
    applied: false
    reason: "Below P0's 1 % threshold at nominal values (no finding by P0's rule). The integrated climb enters r1 through P1-1, which found it above the threshold at the worst endurance point."

  - id: P1-1
    package: P1
    what: integrated climb at the worst endurance point at the target h_T, as a share of the mission fuel (threshold 1 %)
    record: runs/task12/pd/2026-11-27/p1/p1.json
    key: climb_check.states.corner_target.mission_fuel_share
    value: 0.014123125673047646
    applied: true
    entry: climb_model
    how: "The mission's climb leg is flown in 1,000 ft steps at each altitude's own best-climb speed (the integration of prelim/p0_baseline.integrate_climb, coded in conceptual/uav.py), so the sizing and every info-gap rebuild fly it (the ledger copy of the record carries climb_model: integrated)."
    reason: "P1 found 1.41 % at the worst point at h_T, above its 1 % threshold, and the estimate of hours there below 3.5 h."

  - id: P1-2
    package: P1
    what: Stage 1's climb speed over the stall speed at the top of the climb, worst endurance point at h_T
    record: runs/task12/pd/2026-11-27/p1/p1.json
    key: climb_check.states.corner_target.against_stall_at_altitude.end_of_climb_weight.over_stall
    value: 0.9709864792880507
    applied: true
    entry: climb_model
    how: "The same change as P1-1: each altitude of the integrated climb flies its own best-climb speed, never below 1.2 V_stall at that altitude (uav.climb_rate_at)."
    reason: "The two-point climb evaluates the drag at the mission altitude at a speed below the stall speed there."

  - id: P1-3
    package: P1
    what: "CD0 has no band: +10 % on the parasite drag (leakage_fraction 0.155) at the worst endurance point at h = 1 (hours)"
    record: runs/task12/pd/2026-11-27/p1/p1.json
    key: ledger.audit.rows.30.points.2.hours_at_corner_h1
    value: 3.344369955790978
    applied: false
    reason: "Not a band change: no CD0 band was accepted by the owner. Run only as a labelled sensitivity of +-10 % on the parasite drag on the info-gap horizons of r1 (PD-26 item 9). Listed for Gate C."

  - id: P1-4
    package: P1
    what: "five band proposals of the band audit: tail_interference_q [1.04, 1.05], cl_ground [0, 0.1], tyre_drag_per_area [0.13, 0.25], gear_interference [1.2, 1.284], flap_cp_fraction [0.44, 0.45] (number of proposals)"
    record: runs/task12/pd/2026-11-27/p1/p1.json
    key: ledger.audit.n_proposed_bands
    value: 5
    applied: false
    reason: "Not accepted by the owner. The ledger keeps these entries without a band; listed for Gate C."
    proposals:
      - {entry: tail_interference_q, key: ledger.audit.rows.31.proposed_band, value: [1.04, 1.05]}
      - {entry: cl_ground, key: ledger.audit.rows.44.proposed_band, value: [0.0, 0.1]}
      - {entry: tyre_drag_per_area, key: ledger.audit.rows.46.proposed_band, value: [0.13, 0.25]}
      - {entry: gear_interference, key: ledger.audit.rows.48.proposed_band, value: [1.2, 1.284]}
      - {entry: flap_cp_fraction, key: ledger.audit.rows.55.proposed_band, value: [0.44, 0.45]}

