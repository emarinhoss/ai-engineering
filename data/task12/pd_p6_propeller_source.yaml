# Task 12 preliminary design P6: where the propeller data comes from, and every value read from a figure.
# Written by hand on 2026-11-27 from files opened in that session. No value here is from memory.
# Read by prelim/p6_propeller.py; tests/task12_pd/test_p6_bem.py checks its internal consistency.
# The PDFs are kept in the session scratchpad only and are not committed.

reports:
  tr640:
    number: "NACA Report 640 (NACA-TR-640)"
    title: "The Aerodynamic Characteristics of Full-Scale Propellers Having 2, 3, and 4 Blades of Clark Y and R.A.F. 6 Airfoil Sections"
    authors: "Edwin P. Hartman, David Biermann"
    year: 1938
    ntrs_id: "19930091715"
    url: "https://ntrs.nasa.gov/api/citations/19930091715/downloads/19930091715.pdf"
    pdf_sha256: "8dbac568053c7cde59c32364d4853bb47702c745e630e1ce174d1af5048493e0"
    pdf_bytes: 20528338
    pdf_pages: 30
    pdf_committed: false
    opened_in_this_session: true
    used_for: "validation row 5: the measured propeller (blade geometry, Fig. 2; efficiency, Fig. 12)"
    why_this_one: >-
      Of the three candidates (TR-640, TR-650, TR-642; NTRS metadata of all three was read) TR-640 has a
      three-blade propeller, prints the blade-form curves and the efficiency curves of that propeller, and
      was opened first. TR-650 and TR-642 were not downloaded.
  tr259:
    number: "NACA Report 259 (NACA-TR-259)"
    title: "Characteristics of Propeller Sections Tested in the Variable Density Wind Tunnel"
    authors: "Eastman N. Jacobs"
    year: 1928
    ntrs_id: "19930091327"
    url: "https://ntrs.nasa.gov/api/citations/19930091327/downloads/19930091327.pdf"
    found_by: "https://ntrs.nasa.gov/api/citations/search?q=%22propeller%20sections%22%20variable%20density%20wind%20tunnel (one hit)"
    pdf_sha256: "e2bf001c7b4bd07546f021f9f95192b772ceb0afeb5723787ed2178b722f5607"
    pdf_bytes: 867925
    pdf_pages: 16
    pdf_committed: false
    opened_in_this_session: true
    used_for: "section lift and drag of the blade elements (data/task12/pd_p6_tr259_sections.yaml)"
  acr4b04:
    number: "NACA ACR 4B04 (reissued as a NACA Wartime Report)"
    title: "Comparison of Calculated and Experimental Propeller Characteristics for Four-, Six-, and Eight-Blade Single-Rotating Propellers"
    authors: "John L. Crigler"
    year: 1944
    ntrs_id: "19930093324"
    url: "https://ntrs.nasa.gov/api/citations/19930093324/downloads/19930093324.pdf"
    pdf_sha256: "27c59836777023f4634d7d6415b0268aa77c3e44273bb70482e0129d98cb7e08"
    pdf_bytes: 32249852
    pdf_pages: 31
    pdf_committed: false
    opened_in_this_session: true
    used_for: >-
      the open statement of strip theory with a correction for a finite number of blades, recorded before
      use (spec P6 step 2). Its pages 4 to 6 (printed) state the method "as used by Lock": the element
      solidity sigma = B b/(2 pi r), the inflow angle from tan(eps) = sigma C_L/(4 F sin(phi)) with F the
      Goldstein factor read from a chart, and tan(gamma) = C_D/C_L. Only the first 8 PDF pages were read.
    what_it_does_not_give: >-
      It takes F from Goldstein's chart, not from Prandtl's closed form, and it writes the light-loading
      (vortex) form, not the momentum balance per annulus. prelim/bem.py writes the momentum balance
      itself (it follows from Mattingly (L.3) and (L.5) applied to one annulus) and uses Prandtl's
      closed form for F. No opened open source prints Prandtl's F; it is written from its textbook
      definition and that is listed as an assumption in the report.
  opened_and_not_used:
    - {ntrs_id: "19980017535", number: "NASA/TM-1998-206637", sha256: "845814e1a4ac704f5d9e51f7e5d9f96f3e0de65c07e1aec0ef2fcb9592086d76",
       why: "names Glauert's and Adkins and Liebeck's strip theory (PDF pages 53 to 54) but prints no equation of it"}
    - {ntrs_id: "20190027611", number: "AIAA 2019-1219 (slides)", sha256: "a447b546c4fb760023036c09d5f662ae7cd5bf7acb5476b446db22fb93405bb2",
       why: "slides; no equations"}

library_figure:
  what: "Mattingly, Aircraft Engine Design 2nd ed., Fig. L.5, p. 616: element efficiency against inflow angle, (1 - a')/(1 + a) = 0.8"
  page_opened: "2026-11-27, uv run alex page mattingly-aircraft-engine-design 616 (rendered page, 1600 px long side)"
  axis_check: "the frame's 1.0 and 0.0 lines are 500 px apart; the drawn C_L/C_D = infinity line reads 0.800"
  plateau:           # highest value of each curve, near 45 deg
    - {lift_to_drag: 50, reading_eye: 0.768, reading_pixel: 0.768}
    - {lift_to_drag: 10, reading_eye: 0.656, reading_pixel: 0.655}
  reading_uncertainty: 0.01     # the drawn line is 2 px wide (0.004); 0.01 is taken

tr640_test:
  propeller: "Navy design, drawing 5868-9, Clark Y sections, 3 blades (printed page 1)"
  diameter_ft: 10.0
  blades: 3
  body: "geared Curtiss Conqueror engine in a liquid-cooled engine nacelle, 43 in deep, 38 in wide, 126 in long (printed page 2)"
  tunnel: "N.A.C.A. 20-foot wind tunnel, open throat, up to about 115 miles per hour (printed pages 1 and 2)"
  rpm_schedule_3_blades: {15: 1000, 20: 1000, 25: 1000, 30: 900, 35: 800, 40: 800, 45: 700}     # table on printed page 3, row 5868-9, 3 blades
  rpm_note: "held below 115 mph tunnel speed; above, the tunnel speed is held and rpm is about 1,000/(V/nD) (printed page 3)"
  efficiency_definition: >-
    eta = C_T (V/nD)/C_P with the effective thrust T_e = T - delta D, shaft tension less the change of body
    drag due to the slipstream (printed page 3): a propulsive efficiency of the propeller and engine unit,
    not of the isolated propeller.
  precision: "repeat tests usually checked first tests within about 1 percent (printed page 3)"

