efficiency:
  figure: "Figure 12, printed page 7 (PDF page 11): efficiency curves for propeller 5868-9, Clark Y section, 3 blades"
  scan: "PDF page 11 rendered at 300 dpi, figure crop x 171 to 2332, y 2360 to 3249"
  grid: >-
    lines every 0.1 in V/nD and in eta. The page is skewed (about 20 px in 1,600) and the frame's top and
    bottom lines are not on the pitch of the inner lines, so the scale is taken from the 0.1 and 0.9 lines.
  stations: >-
    Chosen before any calculation, where the curve is above 0.5 (it is drawn solid there; dashed below about
    V/nD 0.25). 15 deg: every 0.05 from 0.30 to 0.75. 25 deg: 0.45 (the lowest 0.05 station above 0.5), every
    0.1 from 0.5 to 1.0, and every 0.05 from 1.0 to 1.25, where the curve turns down.
  readings: >-
    code: prelim/p6_figure_read.py, a straight line through the curve's crossings of up to ten columns 8 to
    24 px either side of the station. eye_tile: by eye on 4x enlarged tiles against a mark at a trial value.
  value_rule: "value = mean of the two readings"
  uncertainty_rule: "half the difference of the two readings, at least 0.004 (the drawn line is about 3 px wide)"
  judged_rule: "a station is judged in row 5 if its reading uncertainty is at most 0.015, half the row's tolerance"
  # rows: [V/nD, code, eye_tile]
  blade_angle_15:
