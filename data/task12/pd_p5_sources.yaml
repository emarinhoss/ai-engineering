# Task 12 preliminary design P5 (loads): the open sources and the choices of the package.
# Written by hand on 2026-11-28 from files opened in that session, before the module existed and before any run of it.
# No value here is from memory. The PDFs stay in the session scratchpad and are not committed.
# Read by prelim/p5_loads.py; tests/task12_pd/test_p5_loads.py checks this file.
# Run on Opus 5.5 under owner ruling PD-22 (docs/specs/00_decisions.md section 9): not yet Fable-reviewed.

why: >-
  Spec P5 step 1 asks for a second text of the gust formula and the gust speeds (the airworthiness rule that
  Raymer's (14.4)-(14.8), p. 339, summarise), and step 2 for an alleviation factor computed by time integration
  from the source of the factor (NACA Report 1206). The library has no second gust method (Anderson APD 6.5,
  p. 341-344, gives the manoeuvre diagram only).

