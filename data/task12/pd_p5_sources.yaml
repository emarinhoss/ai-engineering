cs23:
  document: "EASA, Certification Specifications and Acceptable Means of Compliance for Normal, Utility, Aerobatic, and Commuter Category Aeroplanes, CS-23, Amendment 4, 15 July 2015 (Annex to ED Decision 2015/018/R)"
  why_this_one: >-
    The prescriptive CS-23 before EASA's 2017 rewrite into objective rules with consensus standards. It is the
    EASA text, not the FAA's; that its 23.333 and 23.341 equal 14 CFR 23.333 and 23.341 before amendment 23-64 was
    not checked, because no FAA text could be opened (see blocked).
  page_url: "https://www.easa.europa.eu/en/document-library/certification-specifications/cs-23-amendment-4"
  url: "https://www.easa.europa.eu/en/downloads/18858/en"
  pdf_sha256: "c9bb7f4eb17a6e1c8fb510d8bab50e602596a6cd56b9c63305371cdd2ff1397c"
  pdf_bytes: 9311215
  pdf_pages: 409
  pdf_committed: false
  opened: "2026-11-28, curl through the session proxy; text read with pdftotext -layout"
  gust_envelope:
    paragraph: "CS 23.333(c)(1)(i) and (ii), printed page 1-C-2 (PDF page 31)"
    as_read: >-
      Positive (up) and negative (down) gusts of 50 fps at V_C at altitudes between sea level and 20,000 ft, which
      may be reduced linearly from 50 fps at 20,000 ft to 25 fps at 50,000 ft; positive and negative gusts of
      25 fps at V_D at altitudes between sea level and 20,000 ft, which may be reduced linearly from 25 fps at
      20,000 ft to 12.5 fps at 50,000 ft. (iii), 66 fps at V_B, is for the commuter category only.
    U_de_at_V_C_fps: 50.0
    U_de_at_V_D_fps: 25.0
    full_value_up_to_ft: 20000.0
    reduced_to_half_at_ft: 50000.0
  gust_shape:
    paragraph: "CS 23.333(c)(2)(i) and (ii), printed page 1-C-2 (PDF page 31)"
    as_read: "U = (U_de/2)(1 - cos(2 pi s/(25 C))), s the distance penetrated into the gust (ft), C the mean geometric chord of the wing (ft), U_de the derived gust velocity of (c)(1); gust load factors vary linearly with speed between V_C and V_D"
  manoeuvre_envelope:
    paragraph: "CS 23.333(b)(1)-(3), printed page 1-C-2 (PDF page 31)"
    as_read: "the positive manoeuvring load factor of CS 23.337 at speeds up to V_D; the negative manoeuvring load factor of CS 23.337 at V_C; factors varying linearly with speed from the specified value at V_C to 0.0 at V_D for the normal and commuter category, and -1.0 at V_D for the aerobatic and utility categories"
  negative_manoeuvre_factor:
    paragraph: "CS 23.337(b)(1), printed page 1-C-4 (PDF page 33)"
    as_read: "the negative limit manoeuvring load factor may not be less than 0.4 times the positive load factor for the normal, utility and commuter categories"
    ratio_normal_category: 0.4
  dive_speed:
    paragraph: "CS 23.335(b)(2)(i), printed page 1-C-3 (PDF page 32)"
    as_read: "V_D may not be less than 1.40 V_C min for normal and commuter category aeroplanes"
    ratio_normal_category: 1.40
  gust_load_factor:
    paragraph: "CS 23.341(c), printed pages 1-C-4 and 1-C-5 (PDF pages 33-34)"
    as_read: >-
      n = 1 +- k_g rho_0 U_de V a / (2 (W/S)); k_g = 0.88 mu_g/(5.3 + mu_g), the gust alleviation factor;
      mu_g = 2 (W/S)/(rho C a g), the aeroplane mass ratio; rho_0 sea-level density; rho density at the altitude
      considered; W/S the wing loading of the load case; C the mean geometric chord; V the equivalent speed; a the
      slope of the aeroplane normal force coefficient curve per radian (SI units in the text; the relation is
      dimensionless and is used here in ft, lb, s)
    k_g_numerator: 0.88
    k_g_denominator_constant: 5.3
    chord: "mean geometric chord, wing area over span"
  factor_of_safety:
    paragraph: "CS 23.303, printed page 1-C-1 (PDF page 30)"
    as_read: "unless otherwise provided, a factor of safety of 1.5 must be used"
    value: 1.5

# ---- step 2: the source of the alleviation factor ---------------------------------------------------------------
naca1206:
  number: "NACA Report 1206 (NACA-TR-1206)"
  title: "A Revised Gust-Load Formula and a Re-Evaluation of V-G Data Taken on Civil Transport Airplanes From 1933 to 1950"
  author: "Kermit G. Pratt and Walter G. Walker, Langley Aeronautical Laboratory"
  year: 1954
  ntrs_id: "19930090988"
  found_by: "https://ntrs.nasa.gov/api/citations/search?q=revised gust-load formula Pratt Walker"
  url: "https://ntrs.nasa.gov/api/citations/19930090988/downloads/19930090988.pdf"
  pdf_sha256: "70f806383e262cb7652528cf212e7d2cc032d5e33f36b4508fb691c85caa3ec9"
  pdf_bytes: 1586289
  pdf_pages: 12
  pdf_committed: false
  opened: "2026-11-28, curl through the session proxy (host approved by the owner); equations read from the page rendered at 250 dpi, because the text layer is a poor scan"
  assumptions:
    page: "printed p. 3 (PDF page 6), left column"
    as_read: "rigid airplane; constant forward speed; steady level flight before the gust; the airplane can rise but cannot pitch; fuselage and tail lift increments negligible beside the wing's; gust uniform across the span"
  equation_2:
    page: "printed p. 3 (PDF page 6), left column"
    as_read: "a_n(s)/a_ns + (1/mu_g) integral_0^s (1/2pi) C_L_alpha(s - s1) a_n(s1)/a_ns ds1 = integral_0^s (1/2pi) C_L_g(s - s1) d[u(s1)/U]/ds1 ds1 + (u(0)/U)(1/2pi) C_L_g(s)"
    a_ns: "(3): a_ns = m rho S V U/(2W), the acceleration from a steady lift at the gust's largest velocity, g units; m the wing lift-curve slope per radian"
    mu_g: "(4): mu_g = 2W/(m rho c g S)"
    s: "distance of penetration into the gust, chords (symbols, printed p. 2); t = s c/V"
    chord: "c the mean geometric chord, wing area over span; the report's note says the mean aerodynamic chord may be used if used consistently (symbols, printed p. 2)"
  wagner:
    equation: "(5), printed p. 3 (PDF page 6), right column"
    what: "transient lift after a unit jump in angle of attack, normalized to 1, infinite aspect ratio (from NACA Rep. 681, R. T. Jones)"
    form: "phi(s) = 1 - sum A_i exp(-b_i s), s in chords"
    A: [0.165, 0.335]
    b: [0.090, 0.600]
  kussner:
    equation: "(6), printed p. 3 (PDF page 6), right column"
    what: "transient lift on penetration of a sharp-edge gust, normalized to 1, infinite aspect ratio (from NACA Rep. 681)"
    form: "psi(s) = 1 - sum A_i exp(-b_i s), s in chords"
    A: [0.236, 0.513, 0.171]
    b: [0.116, 0.728, 4.84]
  finite_aspect_ratio_note: "printed p. 3: results with these infinite-aspect-ratio functions are probably less than 5 percent different from those with finite-aspect-ratio functions (its ref. 11)"
  gust_shape:
    equation: "(7), printed p. 3 (PDF page 6), right column"
    as_read: "u(s)/U = (1/2)(1 - cos(pi s/H)) for 0 < s < 2H, 0 outside; H = 12.5 chords (the gust-gradient distance, from zero to the largest gust velocity)"
    H_chords: 12.5
  gust_factor:
    equation: "(8) and (9), printed p. 4 (PDF page 7)"
    as_read: "K_g = largest a_n/a_ns over the penetration; K_g = 0.88 mu_g/(5.3 + mu_g) approximates the computed curve with an error less than +-0.01; the numerical solution has an error in a_n/a_ns less than +-0.005"
    fit_error_abs: 0.01
    solution_error_abs: 0.005
  figure_1:
    page: "printed p. 4 (PDF page 7), Fig. 1, representative histories of the acceleration ratio"
    read_by_eye_from_the_rendered_page: "peak marks (K_g) at mu_g 3, 20 and 100 near 0.32, 0.71 and 0.84; grid lines 0.1 apart; read to about +-0.02"
    points: {"3": 0.32, "20": 0.71, "100": 0.84}
    reading_uncertainty: 0.02

# ---- the package's choices, fixed before any run -----------------------------------------------------------------
choices:
  integration:
    solver: "scipy.integrate.solve_ivp, method DOP853, rtol 1e-10, atol 1e-12; the gust's end (s = 2H) is a separate interval"
    end_chords: 37.5          # 3H: the response is followed past the gust's end
    sample_step_chords: 0.001 # the peak is taken on this grid of the dense output
    chord_for_mu: "the chord Stage 1 uses in (14.8), the mean aerodynamic chord (wing.mac), so that the four mass ratios are the record's"
    lift_slope: "Stage 1's lift slope at the Mach number of V_C at each altitude (the record's gusts entries)"
  tolerances:
    row1_relative: 0.05       # spec P5 row 1 (spec 7.1a)
    row2_relative: 0.05       # spec P5 row 2
    row3_positive: 3.8        # R9
    row3_negative_gust: -1.7  # R9 negative limit -1.8 with the 0.1 g margin (B-3)
    negative_manoeuvre_limit: -1.8
    code_check_against_eq9_abs: 0.015   # the report's fit error 0.01 plus its solution error 0.005
  negative_stall:
    section_value_record: "runs/task12/pd/2026-11-27/p2b/p2.json, measured set 2 (Re 6 million, smooth), the lowest set where the negative stall is shown"
    wing_rule: "Raymer (12.15), p. 270, applied to the negative section value: 0.9 times it, quarter chord unswept (an assumption: the book states the rule for the positive stall)"
  manoeuvre_envelope: "Raymer Fig. 14.3, p. 337, and CS 23.333(b) for the normal category: the negative stall line to -1.8, flat to V_C, then linear to 0 at V_D; positive stall line to +3.8, flat to V_D"
  weights:
    takeoff: "r0 W0"
    zero_fuel: "r0 W0 less r0 fuel (the record's convention)"
    payload_off_no_ballast: "zero-fuel weight less the 500 lb payload: hypothetical, because P4b found no layout flyable payload-off without ballast"
    payload_off_with_ballast: "zero-fuel weight less the payload plus the ballast of P4b's chosen layout (ballast_every_loading_lb, runs/task12/pd/2026-11-28/p4b/p4b.json): the operating case"
    payload_off_full_fuel_with_ballast: "take-off weight less the payload plus the same ballast"
  operating_limit:
    altitudes_ft: [0, 2500, 5000, 7500, 10000, 12500, 15000, 17500, 20000, 22500, 23000, 25000, 27500, 30000]
    rule: "the largest equivalent airspeed, not above V_D, at which the gust load factor under the ruled rule (30 ft/s to V_C falling to 15 ft/s at V_D) stays at or below +3.8 and at or above -1.7"
  row4_cases:
    cs23_speeds: "CS 23.333(c) gust speeds (50 fps at V_C, 25 fps at V_D, full values to 20,000 ft), CS 23.341(c) formula"
    ruled_held_30: "the ruled formula with the gust held at 30 ft/s above V_C (at V_D and at the level top speed)"
    weight_cost: "Stage 1 (stage1.analyse, as measurement/robust_sizing.sized_aircraft_guess) at r0's L_sized with the ledger's limit_load_factor raised to the case's largest positive gust load factor at V_C and V_D (both altitudes, take-off and zero-fuel weight); the record's mission and every other ledger value unchanged"
  r1_findings:
    empty_weight_change_lb_source: "runs/task12/pd/2026-11-28/p4b/p4b.json, chosen layout, measures.empty_weight_change_lb"
    rule: "the rows' load factors recomputed with every weight raised by the r1 empty-weight change, wing unchanged (r0 is not re-sized)"
