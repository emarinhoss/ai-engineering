set: drone/rules
quantities:
  - name: payload_mass_kg
    value: 0.5
    units: kg
    confidence: assumed
    band: [0.3, 1.0]
    source: "Éder's choice 2026-11-08, recorded in docs/specs/task10_tasks.md (Decisions) and docs/specs/task10_drone_sizing.md section 2. A design choice with a band, not a sourced value."
  - name: mass_cap_kg
    value: 4.0
    units: kg
    confidence: published
    source: "Commission Delegated Regulation (EU) 2019/945 on unmanned aircraft systems, the class C2 limit of 4 kg maximum take-off mass for open-category operations. Cited from the regulation; not retrieved in the sandbox."
  - name: tail_volume_horizontal
    value: 0.50
    units: "-"
    confidence: published
    source: "Raymer, Aircraft Design: A Conceptual Approach, 5th ed. (AIAA, 2018), table of typical tail volume coefficients, homebuilt and sailplane class, horizontal entry 0.50. Cited from the table; not retrieved in the sandbox."
  - name: tail_volume_vertical
    value: 0.04
    units: "-"
    confidence: published
    source: "Raymer, Aircraft Design: A Conceptual Approach, 5th ed. (AIAA, 2018), table of typical tail volume coefficients, homebuilt class, vertical entry 0.04. Cited from the table; not retrieved in the sandbox."
  - name: tail_arm_chords
    value: 2.5
    units: "-"
    confidence: assumed
    band: [2.0, 3.5]
    source: "Tail arm from the wing quarter-chord to the tail quarter-chord, in mean chords, for a small UAV with a conventional tail. Design rationale, not retrieved, so assumed."
  - name: fuselage_fineness
    value: 6.0
    units: "-"
    confidence: assumed
    band: [4.0, 8.0]
    source: "Fuselage length over diameter for a small fixed-wing UAV body of revolution. Design rationale, not retrieved, so assumed; the body form factor it feeds is published separately below."
  - name: rate_of_climb_m_s
    value: 2.0
    units: m/s
    confidence: assumed
    band: [1.5, 4.0]
    source: "Required climb rate at the design condition for a small UAV, set by the mission rule in docs/specs/task10_drone_sizing.md section 3. Design rationale, not retrieved, so assumed."
  - name: climb_allowance_s
    value: 60.0
    units: s
    confidence: assumed
    band: [30.0, 120.0]
    source: "Take-off and climb time at installed power, subtracted from usable energy, docs/specs/task10_drone_sizing.md section 3. Design rationale, not retrieved, so assumed."
  - name: installed_power_margin
    value: 2.0
    units: "-"
    confidence: assumed
    band: [1.5, 3.0]
    source: "Installed power as a multiple of cruise power, the factor 2 of docs/specs/task10_drone_sizing.md section 3. A design rationale, not a published value, so assumed."
  - name: stall_margin
    value: 1.3
    units: "-"
    confidence: published
    source: "Factor 1.3 on stall speed for the approach margin, the reference landing approach speed of at least 1.3 V_S0 in 14 CFR 23.73 under the pre-2017 numbering of FAR Part 23. The paragraph was not retrieved in the sandbox; cited from memory of the regulation."
  - name: cruise_cl_fraction_of_clmax
    value: 0.7
    units: "-"
    confidence: assumed
    band: [0.6, 0.8]
    source: "Cruise lift coefficient as a fraction of CL_max, the gate 2 limit of docs/specs/task10_drone_sizing.md section 4. Design rationale, not retrieved, so assumed."
  - name: section_stall_angle_deg
    value: 12.0
    units: deg
    confidence: assumed
    band: [10.0, 14.0]
    source: "Section stall angle of thin low-Reynolds-number sections at Re 1e5 to 5e5, to be checked against the UIUC polars of Selig et al., Summary of Low-Speed Airfoil Data, vol. 1 (1995), not yet transcribed. Rationale, so assumed."
  - name: wing_form_factor_k1
    value: 2.0
    units: "-"
    confidence: published
    source: "Raymer, Aircraft Design: A Conceptual Approach, 5th ed. (AIAA, 2018), wing form factor FF = 1 + 2(t/c) + 100(t/c)^4, coefficient of the t/c term. Cited from the text; not retrieved in the sandbox."
  - name: wing_form_factor_k2
    value: 100.0
    units: "-"
    confidence: published
    source: "Raymer, Aircraft Design: A Conceptual Approach, 5th ed. (AIAA, 2018), wing form factor FF = 1 + 2(t/c) + 100(t/c)^4, coefficient of the (t/c)^4 term. Cited from the text; not retrieved in the sandbox."
  - name: body_form_factor_k
    value: 60.0
    units: "-"
    confidence: published
    source: "Raymer, Aircraft Design: A Conceptual Approach, 5th ed. (AIAA, 2018), body form factor FF = 1 + 60/f^3 + f/400 with f the fineness ratio, coefficient 60. Cited from the text; not retrieved in the sandbox."
  - name: cf_laminar_coeff
    value: 1.328
    units: "-"
    confidence: published
    source: "Blasius laminar flat-plate skin friction Cf = 1.328 / sqrt(Re), White, Fluid Mechanics, 7th ed. (McGraw-Hill, 2011), flat-plate boundary-layer section. Cited from the textbook; not retrieved."
  - name: cf_turbulent_coeff
    value: 0.074
    units: "-"
    confidence: published
    source: "Prandtl-Schlichting turbulent flat-plate skin friction Cf = 0.074 Re^(-1/5), White, Fluid Mechanics, 7th ed. (McGraw-Hill, 2011), flat-plate boundary-layer section. Cited from the textbook; not retrieved."
  - name: cf_transition_reynolds
    value: 5.0e+5
    units: "-"
    confidence: published
    source: "Transition Reynolds number 5e5 for flat-plate skin friction, the switch from Blasius to Prandtl-Schlichting, White, Fluid Mechanics, 7th ed. (McGraw-Hill, 2011). Cited from the textbook; not retrieved."
  - name: reynolds_min
    value: 8.0e+4
    units: "-"
    confidence: derived
    source: "Defined by this study: docs/specs/task10_drone_sizing.md section 4 gate 1, the lower Reynolds bound where section data are validated."
  - name: reynolds_max
    value: 5.0e+5
    units: "-"
    confidence: derived
    source: "Defined by this study: docs/specs/task10_drone_sizing.md section 4 gate 1, the upper Reynolds bound where section data are validated."
  - name: tip_chord_min_m
    value: 0.08
    units: m
    confidence: derived
    source: "Defined by this study: docs/specs/task10_drone_sizing.md section 4 gate 4, the manufacturing floor on tip chord."
  - name: spar_depth_min_m
    value: 0.008
    units: m
    confidence: derived
    source: "Defined by this study: docs/specs/task10_drone_sizing.md section 4 gate 4, the manufacturing floor on root section thickness as spar depth."
  - name: wing_loading_min_N_m2
    value: 20.0
    units: N/m^2
    confidence: derived
    source: "Defined by this study: docs/specs/task10_drone_sizing.md section 4 gate 4, the lower wing-loading limit of the design space."
  - name: wing_loading_max_N_m2
    value: 150.0
    units: N/m^2
    confidence: derived
    source: "Defined by this study: docs/specs/task10_drone_sizing.md section 4 gate 4, the upper wing-loading limit of the design space."
  - name: static_margin_target
    value: 0.10
    units: "-"
    confidence: assumed
    band: [0.05, 0.15]
    source: "Target static margin as a fraction of the mean chord, a typical value for a stable small UAV. Design rationale, not retrieved, so assumed."
  - name: section_lift_effectiveness
    value: 0.75
    units: "-"
    confidence: assumed
    band: [0.6, 0.9]
    source: "Fraction of the thin-airfoil lift slope 2 pi that a thin section sustains up to its stall angle at Reynolds numbers of 1e5 to 5e5: the viscous lift slope is about 0.9 x 2 pi and the lift curve rounds off before the stall angle (Abbott and von Doenhoff, Theory of Wing Sections, chapter 7 on maximum lift; low-Reynolds data of Selig et al., Summary of Low-Speed Airfoil Data). A rationale with a band, to be measured against the E387 polars in V6f; Fable's choice 2026-11-08."
  - name: body_form_factor_k2
    value: 400.0
    units: "-"
    confidence: published
    source: "Raymer, Aircraft Design: A Conceptual Approach, 5th ed., body form factor FF = 1 + 60/f^3 + f/400, the second constant"
  - name: tail_aspect_ratio_horizontal
    value: 4.0
    units: "-"
    confidence: assumed
    band: [3.0, 6.0]
    source: "Aspect ratio of the horizontal tail, used only to estimate its mean chord for the Reynolds number of its skin friction. Typical small-UAV value, design rationale, so assumed."
  - name: tail_aspect_ratio_vertical
    value: 1.5
    units: "-"
    confidence: assumed
    band: [1.0, 2.5]
    source: "Aspect ratio of the vertical tail, used only to estimate its mean chord for the Reynolds number of its skin friction. Typical small-UAV value, design rationale, so assumed."
  - name: tail_thickness_ratio
    value: 0.10
    units: "-"
    confidence: assumed
    band: [0.08, 0.12]
    source: "Thickness-to-chord ratio of the flat-plate-like tail surfaces, the same 0.10 that geometry.build uses for their wetted area. Design rationale, so assumed."
