% SU2 incompressible RANS airfoil case, SST with Langtry-Menter transition (family airfoil2d), generated by cases/config.py (do not edit by hand).
% The recorded second attempt of V6e (task10_drone_sizing.md section 9): SST (Menter 2003) with the
% Langtry-Menter gamma-Re_theta transition model in its original correlation (LM_OPTIONS= NONE).
$header
%
% ---- Physics ----
SOLVER= INC_RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
KIND_TRANS_MODEL= LM
LM_OPTIONS= NONE
FREESTREAM_INTERMITTENCY= 1.0
FREESTREAM_TURB2LAMVISCRATIO= 10.0
FREESTREAM_TURBULENCEINTENSITY= $turb_intensity
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_TURB= 1.0
MATH_PROBLEM= DIRECT
%
% ---- Freestream: constant density and viscosity, velocity from the chord Reynolds number ----
% AOA sets the lift and drag directions; INC_VELOCITY_INIT carries the same angle, so the
% farfield velocity and the force axes agree. The mesh is never rotated.
AOA= $aoa
INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_NONDIM= INITIAL_VALUES
INC_DENSITY_INIT= $density
INC_VELOCITY_INIT= $velocity_init
FLUID_MODEL= CONSTANT_DENSITY
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= $viscosity
%
% ---- Reference values (chord 1 m, unit span; moments about the quarter chord) ----
REF_AREA= 1.0
REF_LENGTH= 1.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
%
% ---- Boundary conditions ----
MARKER_HEATFLUX= $heatflux
MARKER_FAR= $far
MARKER_PLOTTING= $plotting
MARKER_MONITORING= $monitoring
%
% ---- Numerics ----
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.05, 1.0, 20.0 )
ITER= $max_iter
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 15
%
% ---- Convergence: Cauchy criterion on the lift and drag coefficients ----
% The first real case (runs/smoke/airfoil2d-96a9dd0f51, 2026-11-08) ran its full 3000 iterations
% with cl still drifting 5.6 percent and cd 17.4 percent over the last tenth, so a residual target
% alone decided nothing. SU2 stops when every listed field converges: for a coefficient that is the
% mean over the last CONV_CAUCHY_ELEMS iterations of |delta|/|value| per iteration below
% CONV_CAUCHY_EPS. postprocess/history.summarize still classifies the run from rms[P] and the drifts.
CONV_FIELD= ( LIFT, DRAG )
CONV_CAUCHY_ELEMS= 200
CONV_CAUCHY_EPS= 1E-5
CONV_STARTITER= 500
%
% ---- Mesh and output ----
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
OUTPUT_FILES= $output_files
SCREEN_OUTPUT= ( INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, LIFT, DRAG )
HISTORY_OUTPUT= ( ITER, RMS_RES, MAX_RES, AERO_COEFF, CFL_NUMBER, LINSOL )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
SCREEN_WRT_FREQ_INNER= 50
HISTORY_WRT_FREQ_INNER= 1
OUTPUT_WRT_FREQ= 1000
TABULAR_FORMAT= CSV
CONV_FILENAME= history
SURFACE_FILENAME= surface_flow
VOLUME_FILENAME= flow
RESTART_FILENAME= restart_flow
SOLUTION_FILENAME= solution_flow
$restart