# Task 12 ledger: requirements and assumptions of the single-turboprop endurance UAV.
# Spec: docs/specs/task12_drone_conceptual_design.md. Units are Raymer's (ft, lb, s, kt, nm, hp).
# confidence: requirement (Eder's choice, spec section 3), default (spec section 3, confirmed at
# Gate A), published (a printed value with its page), assumed (a judgement; must carry a band).
# Raymer = Aircraft Design: A Conceptual Approach, 2nd ed. (1992), as held in the library.

requirements:
  payload_lb:            {value: 500.0, units: lb, confidence: requirement, source: "R4, Eder 2026-11-20 (Q4)"}
  radius_nm:             {value: 200.0, units: nm, confidence: requirement, source: "R5, Eder 2026-11-20 (Q5): 200 nm out and 200 nm back"}
  loiter_h:              {value: 8.0, units: h, confidence: requirement, source: "R5, Eder 2026-11-20 (Q5): 8 h on station"}
  mission_altitude_ft:   {value: 20000.0, units: ft, confidence: requirement, source: "R6, Eder 2026-11-20 (Q6), ISA"}
  field_length_ft:       {value: 2500.0, units: ft, confidence: requirement, source: "R7, Eder 2026-11-20 (Q7): take-off and landing over 50 ft, sea level ISA"}
  stall_speed_kt:        {value: 70.0, units: kt, confidence: requirement, source: "R7: clean stall at take-off weight, sea level"}
  limit_load_factor:     {value: 3.8, units: "-", confidence: requirement, source: "R9, Eder (Q8): Raymer Table 14.2 p. 336 general aviation normal, top of band"}
  negative_load_factor:  {value: -1.5, units: "-", confidence: requirement, source: "R9: Raymer Table 14.2 p. 336, general aviation normal"}
  climb_rate_sl_fpm:     {value: 1000.0, units: ft/min, confidence: default, source: "R12, spec default: sea-level rate of climb at take-off weight"}
  ceiling_ft:            {value: 25000.0, units: ft, confidence: default, source: "R12, spec default: service ceiling (100 ft/min) at take-off weight"}
  ceiling_rate_fpm:      {value: 100.0, units: ft/min, confidence: default, source: "R12: service-ceiling definition"}
  static_margin_min:     {value: 0.05, units: MAC, confidence: default, source: "R13, spec default"}
  static_margin_max:     {value: 0.15, units: MAC, confidence: default, source: "R13, spec default"}
  speed_over_stall:      {value: 1.3, units: "-", confidence: default, source: "Cruise and loiter fly at least 1.3 V_stall clean at the current weight; the rule of Task 10 (docs/specs/task10_drone_sizing.md section 2), kept for comparability. Not from the library."}

assumptions:
  # engine and propeller, Raymer Table 3.4 p. 19 (turboprop)
  cbhp_cruise:           {value: 0.5, units: lb/(hp h), confidence: published, band: [0.45, 0.60], source: "Raymer Table 3.4 p. 19, turboprop cruise; band set by judgement (Mattingly App. K measures it in Stage 3)"}
  cbhp_loiter:           {value: 0.6, units: lb/(hp h), confidence: published, band: [0.50, 0.75], source: "Raymer Table 3.4 p. 19, turboprop loiter; band by judgement"}
  eta_p:                 {value: 0.8, units: "-", confidence: published, band: [0.75, 0.85], source: "Raymer Table 3.4 p. 19, turboprop cruise and loiter propeller efficiency"}
  takeoff_minutes:       {value: 5.0, units: min, confidence: published, source: "Raymer DR-1 refined sizing p. 586: warm-up and take-off at full power"}
  propeller_rpm:         {value: 2000.0, units: rpm, confidence: assumed, band: [1700.0, 2200.0], source: "Turboprop propeller speed, a judgement (PT6A-class propellers run near 2,000 rpm); not from the library"}
  tip_speed_limit_fps:   {value: 950.0, units: ft/s, confidence: published, source: "Raymer p. 221: metal propeller helical tip speed at most 950 ft/s"}
  static_ct_over_cp:     {value: 2.5, units: "-", confidence: published, band: [2.0, 2.8], source: "Raymer DR-1 p. 574, Fig. 13.8 reading for a variable-pitch propeller"}
  installed_engine_factor: {value: 1.4, units: "-", confidence: published, source: "Raymer Table 15.2 p. 398, general aviation installed engine = 1.4 x engine weight (DR-1 p. 576 prefers Table 15.2 over (15.52))"}
  fuel_density_lb_gal:   {value: 6.7, units: lb/gal, confidence: published, source: "Raymer Table 10.5 p. 227, JP-8 mil-spec density"}
  # aerodynamics
  airfoil_cl_max:        {value: 1.5, units: "-", confidence: assumed, band: [1.3, 1.7], source: "Section maximum lift of a 15 % cambered section at Re of a few million; a judgement, not from the library. Stage 3 measures it (SU2 polar and an open NACA data report)"}
  airfoil_cm0:           {value: -0.08, units: "-", confidence: assumed, band: [-0.10, -0.04], source: "Section zero-lift pitching moment of a cambered section; a judgement for the trim check"}
  airfoil_efficiency:    {value: 0.95, units: "-", confidence: published, source: "Raymer (12.8) p. 266 and DR-1 p. 571: airfoil efficiency about 0.95"}
  wing_t_c:              {value: 0.15, units: "-", confidence: published, band: [0.12, 0.18], source: "Raymer Fig. 4.14 p. 47: historical t/c about 0.15 at low Mach"}
  wing_x_c_max_t:        {value: 0.30, units: "-", confidence: published, source: "Raymer p. 283: chordwise maximum-thickness position about 0.3 for low-speed airfoils"}
  wing_taper:            {value: 0.45, units: "-", confidence: published, source: "Raymer 4.3 p. 55-57: taper about 0.45 gives a near-elliptic loading on an unswept wing"}
  flap_delta_cl_max:     {value: 1.3, units: "-", confidence: published, source: "Raymer Table 12.2 p. 279: slotted flap"}
  flap_span_fraction:    {value: 0.60, units: "-", confidence: assumed, band: [0.5, 0.7], source: "Flapped area over reference area (Raymer Fig. 12.19 definition); a layout judgement"}
  takeoff_flap_fraction: {value: 0.60, units: "-", confidence: assumed, band: [0.4, 0.8], source: "Take-off flap increment as a fraction of the landing increment; a judgement (Raymer p. 288 gives take-off deflections of 20-40 deg against 60-70 deg for landing)"}
  laminar_fraction_wing: {value: 0.15, units: "-", confidence: published, band: [0.10, 0.50], source: "Raymer p. 282: 10-20 % typical on wings and tails, about 50 % for a carefully designed composite aircraft"}
  laminar_fraction_fuselage: {value: 0.0, units: "-", confidence: published, band: [0.0, 0.2], source: "Raymer p. 282: essentially none on the fuselage of typical aircraft, 20-35 % for the GP180"}
  roughness_k_ft:        {value: 1.7e-6, units: ft, confidence: published, source: "Raymer Table 12.4 p. 283: smooth molded composite"}
  leakage_fraction:      {value: 0.05, units: "-", confidence: published, source: "Raymer DR-1 p. 572: 5 % for leaks and protuberances"}
  tail_interference_q:   {value: 1.05, units: "-", confidence: published, source: "Raymer p. 284-285: conventional tail Q 1.04-1.05"}
  sensor_drag_area_ft2:  {value: 0.4, units: ft^2, confidence: assumed, band: [0.2, 0.8], source: "Drag area D/q of an external sensor turret; a judgement, not from the library"}
  fuselage_fineness:     {value: 8.0, units: "-", confidence: assumed, band: [6.0, 10.0], source: "Fuselage length over diameter; Raymer 6.4 p. 110 says packaging decides it; a judgement for a crewless body"}
  fuselage_fill:         {value: 0.80, units: "-", confidence: assumed, band: [0.75, 0.85], source: "Projected top and side areas over length x diameter, for Raymer (7.12) p. 152; a judgement"}
  fuselage_kf:           {value: 0.008, units: "-", confidence: published, band: [0.005, 0.015], source: "Raymer (16.22) p. 427 empirical factor from Fig. 16.14, as read in DR-1 p. 579; the chart itself is not readable from the notes"}
  tail_eta_h:            {value: 0.9, units: "-", confidence: published, source: "Raymer (16.6) and DR-1 p. 579: q_h/q about 0.9"}
  ht_aspect_ratio:       {value: 4.0, units: "-", confidence: published, source: "Raymer Table 4.3 p. 76 range for horizontal tails; DR-1 p. 563"}
  ht_taper:              {value: 0.5, units: "-", confidence: published, source: "Raymer Table 4.3 p. 76 range"}
  vt_aspect_ratio:       {value: 1.5, units: "-", confidence: published, source: "Raymer Table 4.3 p. 76 range; DR-1 p. 563"}
  vt_taper:              {value: 0.5, units: "-", confidence: published, source: "Raymer Table 4.3 p. 76 range"}
  tail_t_c:              {value: 0.12, units: "-", confidence: published, source: "Raymer DR-1 p. 563, NACA 0012 tails"}
  c_ht:                  {value: 0.70, units: "-", confidence: published, source: "Raymer Table 6.4 p. 112, general aviation single engine"}
  c_vt:                  {value: 0.04, units: "-", confidence: published, source: "Raymer Table 6.4 p. 112, general aviation single engine"}
  # weights
  composite_factor:      {value: 0.95, units: "-", confidence: published, band: [0.90, 1.00], source: "Raymer p. 14: advanced composites, statistical empty fraction x 0.95 (judgement factor); band per Eder Q8"}
  avionics_uninstalled_lb: {value: 60.0, units: lb, confidence: assumed, band: [40.0, 100.0], source: "Uninstalled flight avionics of a UAV (autopilot, datalink, navigation, transponder); a judgement, not from the library (R15)"}
  gear_load_factor_ultimate: {value: 3.0, units: "-", confidence: published, source: "Raymer DR-1 p. 576: N_l W_l = 3 x W0 in (15.50)"}
  main_gear_length_in:   {value: 30.0, units: in, confidence: assumed, band: [24.0, 40.0], source: "Main gear length; a layout judgement (pusher adds 10 in for propeller clearance, Raymer p. 222: at least 9 in)"}
  nose_gear_length_in:   {value: 30.0, units: in, confidence: assumed, band: [24.0, 40.0], source: "Nose gear length; a layout judgement"}
  gust_ude_fps:          {value: 30.0, units: ft/s, confidence: published, band: [30.0, 50.0], source: "Raymer p. 339: U_de = 30 ft/s up to cruise for civil normal category; band top is the transport value at cruise up to 20,000 ft, Fig. 14.6 p. 340"}
  wing_tank_chord_fraction: {value: 0.45, units: "-", confidence: assumed, band: [0.40, 0.50], source: "Integral wing tank between the spars as a fraction of chord; a judgement"}
  wing_tank_span_fraction: {value: 0.80, units: "-", confidence: assumed, band: [0.70, 0.85], source: "Spanwise extent of the wing tanks as a fraction of the semispan; a judgement"}
  wing_tank_usable:      {value: 0.85, units: "-", confidence: published, source: "Raymer p. 228: integral wing tanks 85 % usable"}
